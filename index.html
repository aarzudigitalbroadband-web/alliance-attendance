<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alliance Broadband Attendance</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 92%;
      max-width: 430px;
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 9px;
      font-size: 16px;
    }

    input {
      border: 1px solid #ddd;
    }

    button {
      border: 0;
      background: #222;
      color: white;
    }

    button:disabled {
      opacity: .5;
    }

    .hidden {
      display: none !important;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      line-height: 1.5;
    }

    video {
      width: 100%;
      margin-top: 15px;
      border-radius: 12px;
      background: black;
    }
  </style>
</head>

<body>

<div class="box">

  <!-- LOGIN -->

  <div id="loginBox">

    <h1>Alliance Broadband</h1>

    <p style="text-align:center">
      Attendance Management
    </p>

    <input
      id="username"
      type="text"
      placeholder="Username">

    <input
      id="password"
      type="password"
      placeholder="Password">

    <button
      type="button"
      id="loginButton">
      Login
    </button>

  </div>


  <!-- DASHBOARD -->

  <div id="dashboard" class="hidden">

    <h1>Alliance Broadband</h1>

    <p id="welcome"></p>

    <button
      type="button"
      id="checkInButton">
      Check-In
    </button>

  </div>


  <div
    id="message"
    class="message">
  </div>


  <!-- CAMERA -->

  <video
    id="camera"
    autoplay
    playsinline
    class="hidden">
  </video>

</div>


<script>

/* ==========================================
   APPS SCRIPT WEB APP URL
========================================== */

const API_URL =
  https://script.google.com/macros/s/AKfycbzPsCWjVfjtU3ehJQkiLwJWdOqJ5bx_HxsYzusN-fhPmtV5VZQHYGNpEfesPruR-NTN/exec

let currentEmployee = null;
let cameraStream = null;


/* ==========================================
   MESSAGE
========================================== */

function showMessage(text) {

  document
    .getElementById("message")
    .innerText = text;

}


/* ==========================================
   LOGIN
========================================== */

document
  .getElementById("loginButton")
  .addEventListener(
    "click",
    login
  );


async function login() {

  const username =
    document
      .getElementById("username")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  if (!username || !password) {

    showMessage(
      "Username और Password डालें।"
    );

    return;
  }


  showMessage(
    "Login हो रहा है..."
  );


  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify({

              action: "LOGIN",

              username:
                username,

              password:
                password

            })
        }
      );


    const result =
      await response.json();


    if (!result.success) {

      showMessage(
        result.message ||
        "Login failed."
      );

      return;
    }


    currentEmployee =
      result;


    document
      .getElementById("loginBox")
      .classList
      .add("hidden");


    document
      .getElementById("dashboard")
      .classList
      .remove("hidden");


    document
      .getElementById("welcome")
      .innerText =
      "Welcome " +
      result.name;


    showMessage(
      "Please Check-In."
    );


  } catch (error) {

    console.error(error);

    showMessage(
      "Login error: " +
      error.message
    );

  }

}


/* ==========================================
   CHECK-IN
========================================== */

document
  .getElementById("checkInButton")
  .addEventListener(
    "click",
    checkIn
  );


function checkIn() {

  showMessage(
    "GPS location प्राप्त की जा रही है..."
  );


  if (!navigator.geolocation) {

    showMessage(
      "इस browser में GPS उपलब्ध नहीं है।"
    );

    return;
  }


  navigator
    .geolocation
    .getCurrentPosition(

      verifyLocation,

      function(error) {

        showMessage(
          "GPS error: " +
          error.message
        );

      },

      {
        enableHighAccuracy: true,
        timeout: 20000,
        maximumAge: 0
      }

    );
}
