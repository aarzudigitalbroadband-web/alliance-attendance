<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alliance Camera Test</title>
</head>

<body style="font-family:Arial;text-align:center;padding:20px;">

  <h2>Alliance Broadband</h2>

  <p id="status">Camera शुरू करने के लिए नीचे दबाएँ</p>

  <button onclick="openCamera()"
          style="padding:15px 25px;font-size:18px;">
    Open Camera
  </button>

  <br><br>

  <video id="camera"
         autoplay
         playsinline
         style="width:100%;max-width:400px;display:none;">
  </video>

  <script>
    async function openCamera() {

      const status =
        document.getElementById("status");

      try {

        status.innerText =
          "Camera permission मांगी जा रही है...";

        const stream =
          await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "user"
            },
            audio: false
          });

        const video =
          document.getElementById("camera");

        video.srcObject = stream;
        video.style.display = "block";

        status.innerText =
          "✅ Camera successfully चालू हो गया।";

      } catch (error) {

        console.error(error);

        status.innerText =
          "❌ Camera Error: " +
          error.name +
          " — " +
          error.message;
      }
    }
  </script>

</body>
</html>
